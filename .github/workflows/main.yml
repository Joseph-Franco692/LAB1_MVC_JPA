name: CI/CD Pipeline - Lab 2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' 
          cache: 'maven'

      # Fase 2: Build y Test
      - name: Build con Maven
        run: mvn clean install

      - name: Run Tests
        run: mvn test

      # Fase 3: Dockerización
      - name: Build Docker Image
        run: |
          docker build -t lab1-mvc-app:latest .